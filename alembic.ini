[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# The URL is resolved in migrations/env.py, per role and per schema prefix. Leaving it out here is
# deliberate: a connection string in a committed file is the mistake this project is set up to
# avoid, and the correct URL depends on whether roles exist yet.
sqlalchemy.url =

file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
